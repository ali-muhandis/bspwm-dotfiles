# ===== Prefix =====
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ===== General =====
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 0
set -g history-limit 10000
set -g set-clipboard on

# ===== Easy Splits =====
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ===== Vim-style Pane Navigation =====
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ===== Resize Panes =====
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ===== New Window in Current Path =====
bind c new-window -c "#{pane_current_path}"

# ===== Reload Config =====
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# ===== Status Bar =====
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=default,fg=#CDD6F4"
set -g status-left-length 40
set -g status-right-length 80

# Pane borders
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89B4FA"

# Message style
set -g message-style "bg=#313244,fg=#CDD6F4"

# Status left - session
set -g status-left "#[fg=#89B4FA,bold]  #S #[fg=#45475A]| "

# Window status
set -g window-status-format "#[fg=#6C7086]  #I #W"
set -g window-status-current-format "#[fg=#89B4FA,bold]  #I #W"
set -g window-status-separator "  "

# Status right
set -g status-right "#[fg=#A6E3A1]  #{b:pane_current_path} #[fg=#45475A]| #[fg=#F9E2AF]  %H:%M #[fg=#45475A]| #[fg=#F5C2E7]  %d/%m"

# ===== Plugins =====
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'sainnhe/tmux-fzf'

# Resurrect
set -g @resurrect-capture-pane-contents 'on'

# Continuum - auto save/restore
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'

# Thumbs - Ctrl+a Space
set -g @thumbs-key Space

# FZF - Ctrl+a F
TMUX_FZF_LAUNCH_KEY="f"

run '~/.tmux/plugins/tpm/tpm'
